name: Deploy para cPanel (FTP)

# Alternativa ao Git Version Control do cPanel.
# Use ESTE arquivo OU o .cpanel.yml — não os dois.
# Antes de usar, crie os secrets no GitHub:
# Settings > Secrets and variables > Actions > New repository secret
#   FTP_SERVER    ex: ftp.yamb.com.br
#   FTP_USERNAME  usuário FTP criado no cPanel
#   FTP_PASSWORD  senha desse usuário

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar arquivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
            **/.cpanel.yml
