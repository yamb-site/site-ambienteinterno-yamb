name: Publicar no servidor (DirectAdmin via FTP)

# Antes do primeiro uso, crie os secrets no GitHub:
# Settings > Secrets and variables > Actions > New repository secret
#   FTP_SERVER    ex: ftp.yamb.com.br  (ou o IP do servidor)
#   FTP_USERNAME  usuário FTP criado no DirectAdmin
#   FTP_PASSWORD  senha desse usuário
#
# Conta FTP criada no DirectAdmin com tipo "Domínio" (raiz uma pasta acima
# de public_html), então o destino é public_html/.
# Se o deploy cair na pasta errada, troque a linha server-dir abaixo por
# domains/yamb.com.br/public_html/

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar arquivos por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./
          server-dir: public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/README.md
