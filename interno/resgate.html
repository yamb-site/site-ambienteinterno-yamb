<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>YAMB · Resgate de dados</title>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4EFE6;font-family:system-ui,sans-serif;color:#1A1714}main{max-width:460px;margin:24px;padding:32px;background:#fff;border-radius:16px;box-shadow:0 2px 12px rgba(0,0,0,.06);display:flex;flex-direction:column;gap:16px}h1{margin:0;font-size:22px}p{margin:0;font-size:15px;line-height:1.5;color:#4A443D}button{padding:14px 18px;border:0;border-radius:999px;background:#1A1714;color:#F4EFE6;font-size:15px;font-weight:600;cursor:pointer}button:disabled{opacity:.4;cursor:default}#st{font-size:14px;font-weight:600}a{color:#8A6A2B}</style></head>
<body><main><h1>Resgate de dados · Ambiente interno</h1>
<p>Esta página salva tudo o que está guardado <b>neste navegador</b> — conteúdos, aprovações, stories, avaliações e pagamentos. Abra no mesmo computador ou celular onde você usa o ambiente.</p>
<p id="st"></p>
<button id="baixar">Baixar arquivo de resgate</button>
<button id="copiar" style="background:#E6DCC8;color:#1A1714">Copiar dados</button>
</main>
<script>
const KEY='yamb-interno-v3';const raw=localStorage.getItem(KEY);let d=null;try{d=JSON.parse(raw)}catch(e){}
const st=document.getElementById('st');
if(!d||!d.items){st.textContent='Nenhum dado encontrado neste navegador.';document.getElementById('baixar').disabled=true;document.getElementById('copiar').disabled=true}
else{const u=(()=>{try{return localStorage.getItem('yamb-mobile-user')||''}catch(e){return ''}})();
st.textContent=d.items.length+' conteúdos · '+(d.stories||[]).length+' stories · '+(d.avaliacoes||[]).length+' avaliações encontrados.';
const nome='yamb-resgate-'+(u?u+'-':'')+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.json';
document.getElementById('baixar').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([raw],{type:'application/json'}));a.download=nome;a.click()};
document.getElementById('copiar').onclick=()=>{navigator.clipboard.writeText(raw).then(()=>st.textContent='Copiado. Cole numa mensagem e envie para quem está restaurando.')}}
</script></body></html>
