<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Visão geral · YAMB (teste)</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/interno/previa/base.css">
<style>
.hero{min-height:236px;padding-bottom:0}
.kpis{display:flex;gap:34px;flex-wrap:wrap;margin-top:6px}
.kpi{display:flex;flex-direction:column;gap:6px}
.kpi .num{font-size:34px}
.kpi span:last-child{font-size:12px;color:var(--ink-300)}
.parado{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:13px}
.parado+.parado{border-top:1px solid rgba(247,228,206,.06)}
.dias{flex:none;min-width:46px;text-align:center;padding:4px 8px;border-radius:999px;background:rgba(240,165,148,.12);border:1px solid rgba(240,165,148,.35);color:var(--bad);font-size:11.5px;font-weight:600}
.filtros{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.dia{display:flex;align-items:baseline;gap:10px;padding:18px 0 6px;font-size:12px;color:var(--ink-300);letter-spacing:.14em;text-transform:uppercase}
.dia b{font-family:var(--disp);font-weight:800;font-size:15px;letter-spacing:0;color:var(--bone);text-transform:none}
.dia.hoje b{color:var(--gold-300);text-shadow:0 0 16px rgba(243,172,47,.5)}
.dia em{font-style:normal;margin-left:auto;letter-spacing:0;text-transform:none}
.lin{border-radius:14px;padding:11px 12px;margin:0 -12px;transition:background .2s}
.lin:hover{background:rgba(243,172,47,.06);box-shadow:inset 3px 0 0 #E09A24}
.lin+.lin{border-top:0}
.st{flex:none;width:96px;text-align:right;font-size:12px;font-weight:600}
.hora{flex:none;width:44px;font-size:12px;color:var(--ink-300);text-align:right}
.selo{flex:none;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600;background:rgba(240,165,148,.12);color:var(--bad);border:1px solid rgba(240,165,148,.3)}
.vazio{padding:34px 0;text-align:center;color:var(--ink-300);font-size:14px}
@media (max-width:1100px){.filtros{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.filtros{grid-template-columns:minmax(0,1fr)}.st{width:auto}.hora{display:none}}
</style>
</head>
<body>
<div class="fundo"><span class="luz1"></span><span class="luz2"></span><span class="grade"></span><img class="tex" src="/assets/bg-dark-texture-min.png" alt=""></div>

<div class="app">
<nav class="trilho" id="trilho" aria-label="Menu"></nav>

<main aria-live="polite">
<section class="card l2 hero">
<div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
<div style="display:flex;flex-direction:column;gap:8px">
<span class="mut" style="font-size:14px">Todas as demandas</span>
<h1 class="num" style="margin:0;font-size:40px">Visão geral</h1>
</div>
<span class="pill" id="mesPill">—</span>
</div>
<div class="kpis">
<div class="kpi"><span class="num" id="kTotal">—</span><span>no mês</span></div>
<div class="kpi"><span class="num" id="kPost" style="color:var(--gold-300);text-shadow:0 0 22px rgba(243,172,47,.4)">—</span><span>postados</span></div>
<div class="kpi"><span class="num" id="kAnd">—</span><span>em andamento</span></div>
<div class="kpi"><span class="num" id="kHoje">—</span><span>saem hoje</span></div>
</div>
<svg id="onda" viewBox="0 0 640 90" preserveAspectRatio="none" aria-hidden="true" style="width:calc(100% + 52px);margin:auto -26px 0;height:90px;display:block"></svg>
</section>

<section class="card estica">
<div class="tit">Parados além do prazo<small id="parInfo"></small></div>
<div style="display:flex;align-items:center;gap:14px"><span class="num" id="parN" style="font-size:46px">—</span><span style="font-size:13px;line-height:1.45;color:var(--ink-200)">demandas paradas<br>na mesma etapa</span></div>
<div id="parados"></div>
<button class="chip" id="soParados" type="button" style="align-self:flex-start;margin-top:auto">Ver só os parados</button>
</section>

<section class="card l3">
<div class="tit">Linha do tempo<small>clique numa etapa para filtrar</small></div>
<div class="trilhoSt" id="linha"></div>
</section>

<section class="card l3">
<div class="filtros">
<label class="campo"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="busca" type="search" placeholder="Buscar título ou cliente" aria-label="Buscar"></label>
<label class="campo"><select id="fCliente" aria-label="Cliente"><option value="">Todos os clientes</option></select></label>
<label class="campo"><select id="fTipo" aria-label="Formato"><option value="">Todos os formatos</option></select></label>
<label class="campo"><select id="fPeriodo" aria-label="Período">
<option value="mes">Este mês</option><option value="semana">Esta semana</option><option value="hoje">Hoje</option><option value="prox">Próximos 7 dias</option><option value="tudo">Tudo</option>
</select></label>
</div>
<div class="chips" id="chips"></div>
<div id="lista"></div>
<button class="botao sec" id="mais" type="button" style="align-self:center;display:none">Mostrar mais</button>
</section>
</main>
</div>
<div class="aviso" id="aviso">Carregando o ambiente interno…</div>

<script src="/interno/previa/base.js"></script>
<script>
(() => {
  const { $, esc, p2, fmt, parse, somaDias, titulo, hoje0, atraso, diasNaEtapa, EQUIPE, MESES, CURTO, DIAS, FLUXO, COR } = Y;
  const PASSO = 40;
  const f = { busca: '', cliente: '', tipo: '', periodo: 'mes', status: '', parados: false, ver: PASSO };
  const check = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#121212" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg>';
  let itens = [];

  const noPeriodo = (i) => {
    const d = parse(i.data); if (!d) return f.periodo === 'tudo';
    const h = hoje0();
    if (f.periodo === 'mes') return d.getMonth() === h.getMonth() && d.getFullYear() === h.getFullYear();
    if (f.periodo === 'hoje') return +d === +h;
    if (f.periodo === 'semana') { const ini = somaDias(h, -((h.getDay() + 6) % 7)); return d >= ini && d < somaDias(ini, 7); }
    if (f.periodo === 'prox') return d >= h && d < somaDias(h, 7);
    return true;
  };
  const filtrados = () => {
    const q = f.busca.trim().toLowerCase();
    return itens.filter((i) => (f.parados ? atraso(i) > 0 : noPeriodo(i)) &&
      (!f.status || (f.status === '__HOJE' ? i.status === 'Postado' && i.data === fmt(hoje0()) : i.status === f.status)) &&
      (!f.cliente || i.cliente === f.cliente) && (!f.tipo || i.tipo === f.tipo) &&
      (!q || (String(i.titulo) + ' ' + i.cliente).toLowerCase().includes(q)));
  };

  function pinta(banco) {
    itens = (banco.items || []).filter((i) => !i.excluido);
    const h = hoje0(), hs = fmt(h);
    const doMes = itens.filter((i) => { const d = parse(i.data); return d && d.getMonth() === h.getMonth() && d.getFullYear() === h.getFullYear(); });

    $('mesPill').textContent = MESES[h.getMonth()].charAt(0).toUpperCase() + MESES[h.getMonth()].slice(1) + ' ' + h.getFullYear();
    $('kTotal').textContent = doMes.length;
    $('kPost').textContent = doMes.filter((i) => i.status === 'Postado').length;
    $('kAnd').textContent = doMes.filter((i) => !['Postado', 'Não postado'].includes(i.status)).length;
    $('kHoje').textContent = itens.filter((i) => i.data === hs && i.tipo !== 'Stories').length;

    // onda: demandas por dia no mês
    const nd = new Date(h.getFullYear(), h.getMonth() + 1, 0).getDate();
    const vals = [...Array(nd)].map((_, k) => doMes.filter((i) => parse(i.data).getDate() === k + 1).length);
    const mx = Math.max(1, ...vals), pts = vals.map((v, k) => [k * 640 / (nd - 1), 82 - v / mx * 66]);
    let dd = 'M' + pts[0][0] + ' ' + pts[0][1];
    for (let k = 1; k < pts.length; k++) { const [x0, y0] = pts[k - 1], [x1, y1] = pts[k], cx = (x0 + x1) / 2; dd += ' C ' + cx + ' ' + y0 + ', ' + cx + ' ' + y1 + ', ' + x1 + ' ' + y1; }
    const hx = pts[h.getDate() - 1];
    $('onda').innerHTML = '<defs><filter id="brilho" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="og" x1="0" x2="1"><stop offset="0" stop-color="#F3AC2F" stop-opacity="0"/><stop offset=".3" stop-color="#F3AC2F"/><stop offset="1" stop-color="#F5C86F"/></linearGradient><linearGradient id="of" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F3AC2F" stop-opacity=".2"/><stop offset="1" stop-color="#F3AC2F" stop-opacity="0"/></linearGradient></defs>' +
      '<path d="' + dd + ' L640 90 L0 90 Z" fill="url(#of)"/><path d="' + dd + '" fill="none" stroke="url(#og)" stroke-width="2.5" filter="url(#brilho)"/>' +
      (hx ? '<line x1="' + hx[0] + '" y1="0" x2="' + hx[0] + '" y2="90" stroke="rgba(243,172,47,.35)" stroke-dasharray="3 4"/><circle cx="' + hx[0] + '" cy="' + hx[1] + '" r="5" fill="#F5C86F" filter="url(#brilho)"/>' : '');

    // parados além do prazo
    const par = itens.filter((i) => atraso(i) > 0).sort((a, b) => atraso(b) - atraso(a));
    $('parN').textContent = par.length;
    $('parN').style.color = par.length ? 'var(--bad)' : 'var(--ok)';
    $('parInfo').textContent = 'prazo por etapa';
    $('parados').innerHTML = par.slice(0, 4).map((i) => '<div class="parado"><span class="dias">' + atraso(i) + 'd</span><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span class="elip">' + esc(i.titulo || '(sem título)') + '</span><span class="mut elip" style="font-size:11.5px">' + esc(titulo(i.cliente)) + ' · em ' + esc(i.status) + '</span></div></div>').join('') ||
      '<p class="mut" style="margin:0;font-size:13px">Nada parado. Fluxo em dia.</p>';
    $('soParados').style.display = par.length ? '' : 'none';

    // selects (mantém a escolha)
    const opts = (el, vals, rot) => { const v = el.value; el.innerHTML = '<option value="">' + rot + '</option>' + vals.map((x) => '<option value="' + esc(x) + '">' + esc(el.id === 'fCliente' ? titulo(x) : x) + '</option>').join(''); el.value = vals.includes(v) ? v : ''; };
    opts($('fCliente'), [...new Set(itens.map((i) => i.cliente))].filter(Boolean).sort(), 'Todos os clientes');
    opts($('fTipo'), [...new Set(itens.map((i) => i.tipo))].filter(Boolean).sort(), 'Todos os formatos');

    pintaLinha(); pintaLista();
  }

  function base() { // itens do período e filtros, sem o filtro de etapa (para os números da linha)
    const s = f.status; f.status = ''; const r = filtrados(); f.status = s; return r;
  }

  function pintaLinha() {
    const b = base(), hs = fmt(hoje0());
    const etapas = [...FLUXO.map((s) => [s, s, b.filter((i) => i.status === s).length]), ['__HOJE', 'Postados do dia', itens.filter((i) => i.status === 'Postado' && i.data === hs).length]];
    $('linha').innerHTML = etapas.map(([k, rot, n], j) => (j ? '<span class="fio"></span>' : '') +
      '<button type="button" class="et' + (f.status === k ? ' on' : '') + '" data-k="' + k + '" aria-pressed="' + (f.status === k) + '"><span class="bola' + (n ? '' : ' apag') + '"></span><span class="n">' + n + '</span><span class="r">' + rot + '</span>' +
      (k === '__HOJE' ? '<span class="mut" style="font-size:10.5px;margin-top:-4px">' + hs.slice(0, 5) + '</span>' : '') + '</button>').join('');
    const b2 = base();
    $('chips').innerHTML = '<button type="button" class="chip' + (!f.status ? ' on' : '') + '" data-k="">Todas <b>' + b2.length + '</b></button>' +
      FLUXO.map((s) => { const n = b2.filter((i) => i.status === s).length; return n ? '<button type="button" class="chip' + (f.status === s ? ' on' : '') + '" data-k="' + s + '"><span style="width:7px;height:7px;border-radius:50%;background:' + COR[s] + '"></span>' + s + ' <b>' + n + '</b></button>' : ''; }).join('') +
      (f.parados ? '<button type="button" class="chip on" data-p="1">Só parados ✕</button>' : '');
  }

  function pintaLista() {
    const l = filtrados().sort((a, b) => (parse(a.data) || 0) - (parse(b.data) || 0) || String(a.hora || '').localeCompare(String(b.hora || '')) || String(a.cliente).localeCompare(String(b.cliente)));
    const vis = l.slice(0, f.ver), hs = fmt(hoje0());
    let html = '', ult = null;
    vis.forEach((i) => {
      if (i.data !== ult) {
        ult = i.data; const d = parse(i.data), n = l.filter((x) => x.data === i.data).length;
        html += '<div class="dia' + (i.data === hs ? ' hoje' : '') + '"><b>' + (d ? p2(d.getDate()) + ' ' + MESES[d.getMonth()].slice(0, 3) : 'Sem data') + '</b>' + (d ? (i.data === hs ? 'Hoje' : DIAS[d.getDay()]) : '') + '<em>' + n + ' conteúdo' + (n === 1 ? '' : 's') + '</em></div>';
      }
      const ok = i.status === 'Postado', at = atraso(i), p = EQUIPE[i.produtor];
      const nome = '<span class="elip" style="font-size:14px">' + esc(i.titulo || '(sem título)') + '</span>';
      html += '<div class="lin"><span class="chk' + (ok ? ' ok' : '') + '">' + (ok ? check : '') + '</span>' +
        '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">' + (i.trello ? '<a href="' + esc(i.trello) + '" target="_blank" rel="noopener" style="color:inherit;min-width:0;display:flex" title="Abrir no Trello">' + nome + '</a>' : nome) +
        '<span class="mut elip" style="font-size:12px">' + esc(titulo(i.cliente)) + ' · ' + esc(i.tipo) + (i.capa && i.capa.precisa && !i.capa.pronta ? ' · capa pendente' : '') + '</span></div>' +
        (at ? '<span class="selo">parado ' + at + 'd</span>' : '') +
        (p ? '<img class="av" src="/assets/team/' + p[1] + '.png" alt="' + p[0] + '" title="' + p[0] + '">' : '<span class="av" style="background:#252525"></span>') +
        '<span class="hora">' + esc(i.hora || '') + '</span>' +
        '<span class="st" style="color:' + (COR[i.status] || 'var(--ink-300)') + '">' + esc(i.status) + '</span></div>';
    });
    $('lista').innerHTML = html || '<div class="vazio">Nenhuma demanda com esses filtros.</div>';
    const resto = l.length - vis.length;
    $('mais').style.display = resto > 0 ? '' : 'none';
    $('mais').textContent = 'Mostrar mais (' + resto + ')';
  }

  const repinta = () => { f.ver = PASSO; pintaLinha(); pintaLista(); };
  $('busca').oninput = (e) => { f.busca = e.target.value; repinta(); };
  $('fCliente').onchange = (e) => { f.cliente = e.target.value; repinta(); };
  $('fTipo').onchange = (e) => { f.tipo = e.target.value; repinta(); };
  $('fPeriodo').onchange = (e) => { f.periodo = e.target.value; f.parados = false; repinta(); };
  $('mais').onclick = () => { f.ver += PASSO; pintaLista(); };
  $('soParados').onclick = () => { f.parados = true; f.status = ''; repinta(); document.getElementById('lista').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  const clicaEtapa = (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.p) { f.parados = false; return repinta(); }
    const k = b.dataset.k; f.status = f.status === k ? '' : k;
    if (k === '__HOJE') f.periodo = 'mes';
    repinta();
  };
  $('linha').onclick = clicaEtapa; $('chips').onclick = clicaEtapa;

  Y.inicia({ tela: 'visao', pinta });
})();
</script>
</body>
</html>
