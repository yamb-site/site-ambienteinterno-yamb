<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A0A">
<title>Painel de Tráfego · YAMB</title>
<link rel="icon" href="/interno/icon.png">
<link rel="preconnect" href="https://yamb-trafego.gabrielsocialm21.workers.dev">
<link rel="stylesheet" href="/tokens/colors.css">
<link rel="stylesheet" href="/tokens/fonts.css">
<!-- Painel de Tráfego (YA - Tráfego). Página própria, fora da exportação do interno.
     Dados: Worker yamb-trafego (só leitura), que guarda o token do Meta. Nada sensível aqui.
     Estado (aba, cliente, subaba, período, filtros) fica no endereço (#...), para poder mandar o link. -->
<style>
:root{
  color-scheme:dark;
  --bg:#0A0A0A; --card:#121212; --raised:#1C1C1C; --line:#2A2A2A; --line-2:#3A3A3A;
  --text:var(--bone,#F7E4CE); --muted:#A3A3A3; --gold:var(--gold-400,#F3AC2F); --gold-d:var(--gold-500,#E09A24); --gold-soft:#2A1E0C;
  --ok:#7CCB97; --bad:#EE8B74; --warn:var(--gold-300,#F5C86F);
  --font:'Sora',system-ui,sans-serif; --display:'Monument Extended','Sora',sans-serif;
  --r-lg:20px; --r-md:14px; --r-pill:999px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{color:var(--gold);text-underline-offset:3px}
a:hover{color:#FFD27A}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance}
.pular{position:absolute;left:-999px;top:8px;background:var(--gold);color:#121212;padding:8px 14px;border-radius:var(--r-pill);z-index:10}
.pular:focus{left:16px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1320px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-left)) 64px}
.num{font-variant-numeric:tabular-nums}

/* topo */
.topo{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;margin-bottom:16px}
.topo img{height:22px;width:auto}
.topo h1{font-family:var(--display);font-weight:800;font-size:clamp(17px,2.6vw,22px);letter-spacing:.02em;margin:0;flex:1 1 auto}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input[type=search],input[type=password]{background:var(--raised);color:var(--text);border:1px solid var(--line);border-radius:var(--r-pill);padding:8px 14px;min-height:40px}
select{background-color:var(--raised);color:var(--text)}
input[type=search]{min-width:min(260px,100%)}
.btn{background:var(--gold-d);color:#121212;border:0;border-radius:var(--r-pill);padding:9px 18px;font-weight:600;cursor:pointer;min-height:40px;transition:background-color .15s}
.btn:hover{background:var(--gold)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);transition:border-color .15s,background-color .15s}
.btn.ghost:hover{border-color:var(--line-2);background:var(--raised)}
.meta{color:var(--muted);font-size:13px}

/* abas */
.abas{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 20px;scrollbar-width:none}
.abas::-webkit-scrollbar{display:none}
.abas a{color:var(--muted);text-decoration:none;padding:12px 16px;border-bottom:2px solid transparent;white-space:nowrap;font-weight:500;transition:color .15s,border-color .15s}
.abas a:hover{color:var(--text)}
.abas a[aria-current=page]{color:var(--text);border-bottom-color:var(--gold)}
.abas a .cont{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:var(--r-pill);background:var(--gold-soft);color:var(--warn);font-size:12px;text-align:center}
.sub{border-bottom:0;margin-bottom:16px;gap:6px}
.sub a{border:1px solid var(--line);border-radius:var(--r-pill);padding:7px 14px}
.sub a[aria-current=page]{background:var(--raised);border-color:var(--gold)}

/* blocos */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:0 0 20px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px}
.kpi .r{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.kpi b{display:block;font-size:clamp(20px,2.4vw,26px);font-weight:600;margin:4px 0 2px}
.delta{font-size:12px}
.delta.bom{color:var(--ok)} .delta.ruim{color:var(--bad)} .delta.neutro{color:var(--muted)}
.grade2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr));gap:16px;margin-bottom:16px}
.cartao{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px;min-width:0}
.cartao h2{font-size:15px;font-weight:600;margin:0 0 12px}
.cartao h2 small{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.barra{display:grid;grid-template-columns:minmax(90px,140px) 1fr auto;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.barra .trilho{height:8px;background:var(--raised);border-radius:4px;overflow:hidden}
.barra .trilho i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-d),var(--gold));border-radius:4px}
.barra .v{color:var(--muted);white-space:nowrap}
.barra .v b{color:var(--text);font-weight:600}

/* tabelas */
.tabela{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-md);overscroll-behavior-x:contain}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line);vertical-align:top}
thead th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.06em;background:var(--raised);position:sticky;top:0;z-index:1}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:220px;max-width:380px;overflow-wrap:anywhere}
tbody tr{content-visibility:auto;contain-intrinsic-size:auto 52px}
tbody tr:hover{background:#161616}
tr:last-child td{border-bottom:0}
th button{all:unset;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
th[aria-sort=ascending] button::after{content:"↑"} th[aria-sort=descending] button::after{content:"↓"}
td .sub-l{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:var(--r-pill);background:var(--raised);color:var(--muted);margin:4px 4px 0 0;white-space:nowrap}
.tag.alto{background:#3A1A12;color:var(--bad)} .tag.medio{background:#3A2A10;color:var(--warn)} .tag.baixo{background:#1E2A22;color:var(--ok)}

/* chips de categoria */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:var(--r-pill);padding:6px 12px;cursor:pointer;font-size:13px;transition:border-color .15s,background-color .15s}
.chip:hover{border-color:var(--line-2)}
.chip[aria-pressed=true]{background:var(--gold-soft);border-color:var(--gold);color:var(--text)}

/* clientes */
.clientes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.cli{display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;color:var(--text);text-decoration:none;transition:border-color .15s,transform .15s}
.cli:hover{border-color:var(--gold);color:var(--text)}
.cli h3{margin:0;font-size:16px;font-weight:600}
.cli .emp{color:var(--muted);font-size:12px}
.cli dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:12px 0 0}
.cli dt{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.cli dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

/* anúncios */
.anuncios{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr));gap:12px}
.anu{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;display:flex;flex-direction:column}
.anu img{width:100%;height:180px;object-fit:cover;background:var(--raised);display:block}
.anu .semimg{height:180px;background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:12px}
.anu .c{padding:14px 16px}
.anu h3{font-size:14px;margin:0 0 4px;overflow-wrap:anywhere}
.anu p{color:var(--muted);font-size:12px;margin:0 0 8px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.anu dl{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0 0;font-size:12px}
.anu dt{color:var(--muted)} .anu dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}

/* alertas */
.alerta{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.alerta:last-child{border-bottom:0}
.alerta .tag{margin-top:2px}

/* gráfico */
.grafico svg{width:100%;height:auto;display:block}
.grafico .leg{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:8px}
.grafico .leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.vazio{padding:24px;color:var(--muted);text-align:center}
.erro{color:var(--bad)}
.carregando{color:var(--muted);padding:40px 0;text-align:center}
.voltar{display:inline-block;margin-bottom:12px;font-size:13px}
.cabcli{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px;margin-bottom:16px}
.cabcli h2{font-size:clamp(20px,3vw,26px);margin:0;font-weight:600}

/* entrada */
#entrar{max-width:380px;margin:12vh auto;text-align:center}
#entrar img{height:30px;width:auto;margin-bottom:24px}
#entrar h1{font-family:var(--display);font-size:22px;margin:0 0 8px}
#entrar form{display:flex;flex-direction:column;gap:12px;margin-top:24px}
#entrar input{border-radius:var(--r-md);text-align:center}

@media (max-width:620px){
  .topo h1{flex-basis:100%;order:2}
  .ctl{width:100%} .ctl select,.ctl input[type=search]{flex:1 1 140px}
  .barra{grid-template-columns:90px 1fr;}
  .barra .v{grid-column:1/-1;margin-top:-4px}
}
@media (pointer:fine){html{overscroll-behavior:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<main class="wrap">

<section id="entrar" hidden>
  <img src="/assets/logo-yamb-wordmark-cream.png" alt="YAMB" width="107" height="30">
  <h1>Painel de Tráfego</h1>
  <p class="meta">Campanhas ativas e desempenho de todos os clientes.</p>
  <form id="form-senha">
    <label for="senha" class="meta">Senha do painel</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit" id="btn-entrar">Entrar</button>
    <p id="erro-senha" class="erro" role="alert" aria-live="polite"></p>
  </form>
  <p class="meta"><a href="/interno/">Voltar ao ambiente interno</a></p>
</section>

<section id="painel" hidden>
  <div class="topo">
    <a href="#aba=geral" aria-label="Painel de Tráfego — visão geral"><img src="/assets/logo-yamb-wordmark-cream.png" alt="YAMB" width="79" height="22"></a>
    <h1>Painel de Tráfego</h1>
    <div class="ctl">
      <label class="meta" for="periodo">Período</label>
      <select id="periodo" name="periodo">
        <option value="today">Hoje</option>
        <option value="yesterday">Ontem</option>
        <option value="last_7d">Últimos 7 dias</option>
        <option value="last_30d">Últimos 30 dias</option>
        <option value="this_month">Este mês</option>
        <option value="last_month">Mês passado</option>
      </select>
      <button class="btn ghost" id="atualizar" type="button">Atualizar</button>
      <button class="btn ghost" id="sair" type="button">Sair</button>
    </div>
  </div>
  <nav class="abas" id="abas" aria-label="Seções do painel"></nav>
  <p class="meta" id="info" aria-live="polite"></p>
  <div id="conteudo" tabindex="-1"><p class="carregando">Carregando campanhas…</p></div>
  <p class="meta"><a href="/interno/">Voltar ao ambiente interno</a> · Dados do Meta Ads (só leitura), atualizados a cada 10 minutos.</p>
</section>

</main>
<script>
(function () {
  'use strict';
  var API = 'https://yamb-trafego.gabrielsocialm21.workers.dev';
  var CHAVE = 'yamb-trafego-senha';
  var $ = function (id) { return document.getElementById(id); };
  var geral = null, clientes = {}, estado = {};

  // ------------------------------------------------ armazenamento e rede
  function guardar(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) {} }
  function ler(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
  var senha = ler(CHAVE);
  function pedir(rota) {
    return fetch(API + rota, { headers: { 'X-Painel-Senha': senha || '' } }).then(function (r) {
      return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.erro || ('Erro ' + r.status)); e.status = r.status; throw e; } return j; });
    });
  }

  // ------------------------------------------------ formatação
  var fmtMoeda = {}, fmtInt = new Intl.NumberFormat('pt-BR'), fmtDec = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  var fmtDia = new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', timeZone: 'UTC' });
  var fmtDiaLongo = new Intl.DateTimeFormat('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit', timeZone: 'UTC' });
  var fmtHora = new Intl.DateTimeFormat('pt-BR', { hour: '2-digit', minute: '2-digit' });
  function R(v, m) { if (v == null || isNaN(v)) return '—'; m = m || 'BRL'; if (!fmtMoeda[m]) fmtMoeda[m] = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: m }); return fmtMoeda[m].format(v); }
  function N(v) { return v == null ? '—' : fmtInt.format(Math.round(v)); }
  function P(v) { return v == null || isNaN(v) ? '—' : fmtDec.format(v) + '%'; }
  function D(v) { return !v ? '—' : fmtDec.format(v); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function data(iso) { return fmtDia.format(new Date(iso + 'T00:00:00Z')); }

  var OBJETIVOS = { OUTCOME_LEADS: 'Leads', OUTCOME_ENGAGEMENT: 'Engajamento', OUTCOME_TRAFFIC: 'Tráfego', OUTCOME_AWARENESS: 'Reconhecimento', OUTCOME_SALES: 'Vendas', OUTCOME_APP_PROMOTION: 'App', MESSAGES: 'Mensagens', LINK_CLICKS: 'Cliques', CONVERSIONS: 'Conversões', REACH: 'Alcance', BRAND_AWARENESS: 'Reconhecimento', LEAD_GENERATION: 'Leads', POST_ENGAGEMENT: 'Engajamento', VIDEO_VIEWS: 'Vídeo', PAGE_LIKES: 'Curtidas' };
  var STATUS = { ACTIVE: 'Ativa', IN_PROCESS: 'Em processamento', WITH_ISSUES: 'Com problema', INATIVA: 'Sem veiculação agora' };
  var OTIMIZACAO = { CONVERSATIONS: 'Conversas', LEAD_GENERATION: 'Leads', LINK_CLICKS: 'Cliques no link', LANDING_PAGE_VIEWS: 'Visualizações da página', REACH: 'Alcance', IMPRESSIONS: 'Impressões', POST_ENGAGEMENT: 'Engajamento', THRUPLAY: 'ThruPlay', OFFSITE_CONVERSIONS: 'Conversões', PROFILE_VISIT: 'Visitas ao perfil', QUALITY_LEAD: 'Leads de qualidade', VALUE: 'Valor', PAGE_LIKES: 'Curtidas' };
  var NIVEL = { alto: 'Urgente', medio: 'Atenção', baixo: 'Aviso' };

  // Variação contra o período anterior. menorMelhor = custos.
  function delta(atual, ant, menorMelhor, neutro) {
    if (ant == null || !ant || atual == null) return '<span class="delta neutro">sem comparação</span>';
    var v = (atual - ant) / ant * 100;
    if (!isFinite(v)) return '';
    var cls = neutro || Math.abs(v) < 1 ? 'neutro' : ((v > 0) !== !!menorMelhor ? 'bom' : 'ruim');
    var seta = v > 0 ? '▲' : (v < 0 ? '▼' : '•');
    return '<span class="delta ' + cls + '"><span aria-hidden="true">' + seta + '</span> ' + fmtDec.format(Math.abs(v)).replace(/,00$/, '') + '% vs período anterior</span>';
  }
  function kpi(r, v, d) { return '<div class="kpi"><span class="r">' + r + '</span><b class="num">' + v + '</b>' + (d || '') + '</div>'; }
  function kpis(t, ant, m) {
    ant = ant || {};
    return '<div class="kpis">' +
      kpi('Investido', R(t.gasto, m), delta(t.gasto, ant.gasto, false, true)) +
      kpi('Resultados', N(t.resultados), delta(t.resultados, ant.resultados)) +
      kpi('Custo por resultado', R(t.custoPorResultado, m), delta(t.custoPorResultado, ant.custoPorResultado, true)) +
      kpi('Alcance', N(t.alcance), delta(t.alcance, ant.alcance)) +
      kpi('Cliques', N(t.cliques), delta(t.cliques, ant.cliques)) +
      kpi('CTR', P(t.ctr), delta(t.ctr, ant.ctr)) +
      kpi('CPC', R(t.cpc, m), delta(t.cpc, ant.cpc, true)) +
      kpi('CPM', R(t.cpm, m), delta(t.cpm, ant.cpm, true)) + '</div>';
  }
  function barras(lista, campo, rotulo, m) {
    var max = Math.max.apply(null, lista.map(function (x) { return x[campo] || 0; }).concat([0]));
    var total = lista.reduce(function (s, x) { return s + (x[campo] || 0); }, 0);
    if (!lista.length || !max) return '<p class="vazio">Sem dados no período.</p>';
    return lista.map(function (x) {
      var v = x[campo] || 0;
      return '<div class="barra"><span>' + esc(rotulo(x)) + '</span><span class="trilho" aria-hidden="true"><i style="width:' + (v / max * 100).toFixed(1) + '%"></i></span>' +
        '<span class="v num"><b>' + R(v, m) + '</b> · ' + Math.round(v / total * 100) + '% · ' + N(x.resultados) + ' result. · ' + R(x.custoPorResultado, m) + '/result.</span></div>';
    }).join('');
  }

  // Tabela ordenável. colunas: [rótulo, chave, formatador, {esq, nao}].
  function tabela(id, linhas, colunas, ordemPadrao) {
    var o = (estado.ordem && estado.ordem.split(':')[0] === id) ? estado.ordem.split(':') : [id, ordemPadrao || 'gasto', 'd'];
    var chave = o[1], desc = o[2] !== 'a';
    var col = colunas.filter(function (c) { return c[1] === chave; })[0];
    if (col && !(col[3] && col[3].nao)) {
      linhas = linhas.slice().sort(function (a, b) {
        var x = a[chave], y = b[chave];
        if (typeof x === 'string' || typeof y === 'string') return (desc ? -1 : 1) * String(x || '').localeCompare(String(y || ''), 'pt-BR');
        return (desc ? -1 : 1) * ((x == null ? -Infinity : x) - (y == null ? -Infinity : y));
      });
    }
    if (!linhas.length) return '<p class="vazio">Nenhum item no período.</p>';
    var h = '<div class="tabela"><table><thead><tr>' + colunas.map(function (c) {
      if (c[3] && c[3].nao) return '<th scope="col">' + c[0] + '</th>';
      var s = c[1] === chave ? (desc ? 'descending' : 'ascending') : 'none';
      return '<th scope="col" aria-sort="' + s + '"><button type="button" data-ordem="' + id + ':' + c[1] + ':' + (c[1] === chave && desc ? 'a' : 'd') + '">' + c[0] + '</button></th>';
    }).join('') + '</tr></thead><tbody>';
    linhas.forEach(function (l) { h += '<tr>' + colunas.map(function (c) { return '<td>' + c[2](l) + '</td>'; }).join('') + '</tr>'; });
    return h + '</tbody></table></div>';
  }
  function tags(l) { return (l.alertas || []).map(function (a) { return '<span class="tag ' + a.nivel + '">' + esc(a.texto) + '</span>'; }).join(''); }
  function orcamento(l, m) { return l.orcamentoDiario != null ? R(l.orcamentoDiario, m) + '/dia' : (l.orcamentoTotal != null ? R(l.orcamentoTotal, m) + ' total' : '<span class="meta">no conjunto</span>'); }
  function colsMetricas(m) {
    return [
      ['Investido', 'gasto', function (l) { return R(l.gasto, m || l.moeda); }],
      ['Resultados', 'resultados', function (l) { return N(l.resultados) + (l.resultado ? '<span class="sub-l">' + esc(l.resultado) + '</span>' : ''); }],
      ['Custo/result.', 'custoPorResultado', function (l) { return R(l.custoPorResultado, m || l.moeda); }],
      ['Alcance', 'alcance', function (l) { return N(l.alcance); }],
      ['Impressões', 'impressoes', function (l) { return N(l.impressoes); }],
      ['Freq.', 'frequencia', function (l) { return D(l.frequencia); }],
      ['Cliques', 'cliques', function (l) { return N(l.cliques); }],
      ['CTR', 'ctr', function (l) { return P(l.ctr); }],
      ['CPC', 'cpc', function (l) { return R(l.cpc || null, m || l.moeda); }],

    svg += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="#F7E4CE" stroke-width="2"/>';
    var resumo = 'Gráfico de ' + n + ' dias: investimento máximo ' + R(maxG, m) + ' por dia e até ' + N(maxR) + ' resultados por dia.';
    return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(resumo) + '">' + svg + '</svg><div class="leg"><span><i style="background:#E09A24"></i>Investido (eixo esquerdo)</span><span><i style="background:#F7E4CE"></i>Resultados (eixo direito)</span></div>';
  }

  // ------------------------------------------------ eventos
  function ligarFiltros() {
    document.querySelectorAll('.chip[data-cat]').forEach(function (b) { b.addEventListener('click', function () { ir({ cat: b.getAttribute('data-cat') }); }); });
    var cli = $('cli'); if (cli) cli.addEventListener('change', function () { ir({ cli: cli.value }); });
    var b = $('busca'); if (b) b.addEventListener('change', function () { ir({ busca: b.value }); });
  }
  $('conteudo').addEventListener('click', function (e) {
    var t = e.target.closest('[data-ordem]');
    if (t) { e.preventDefault(); ir({ ordem: t.getAttribute('data-ordem') }); }
  });
  $('periodo').addEventListener('change', function () { ir({ periodo: $('periodo').value }); });
  $('atualizar').addEventListener('click', function () { geral = null; clientes = {}; render(); });
  $('sair').addEventListener('click', function () { sair(); });
  window.addEventListener('hashchange', function () { var cli = estado.cliente, aba = estado.aba, sub = estado.sub; render(); if (lerEstado().cliente !== cli || lerEstado().aba !== aba || lerEstado().sub !== sub) window.scrollTo(0, 0); });

  function mostrar(qual) { $('entrar').hidden = qual !== 'entrar'; $('painel').hidden = qual !== 'painel'; }
  function avisoToken() {
    pedir('/token').then(function (t) {
      var aviso = null;
      if (!t.valido) aviso = 'A chave do Meta não é mais válida. Gere uma nova e atualize no cofre da Cloudflare (peça ao YA - Tráfego).';
      else if (t.venceEm && t.venceEm !== 'sem vencimento') { var dias = Math.floor((new Date(t.venceEm) - new Date()) / 864e5); if (dias <= 10) aviso = 'A chave do Meta vence em ' + dias + ' dia(s). Gere uma nova antes disso (peça ao YA - Tráfego).'; }
      if (aviso) $('info').insertAdjacentHTML('afterend', '<p class="erro" role="status">' + esc(aviso) + '</p>');
    }).catch(function () {});
  }
  function entrar() { mostrar('painel'); render(); avisoToken(); }
  function sair(msg) { senha = null; guardar(CHAVE, null); geral = null; clientes = {}; mostrar('entrar'); $('erro-senha').textContent = msg || ''; $('senha').value = ''; if (matchMedia('(pointer:fine)').matches) $('senha').focus(); }

  $('form-senha').addEventListener('submit', function (ev) {
    ev.preventDefault();
    senha = $('senha').value; $('erro-senha').textContent = '';
    var bt = $('btn-entrar'); bt.disabled = true; bt.textContent = 'Entrando…';
    pedir('/contas').then(function () { guardar(CHAVE, senha); entrar(); })
      .catch(function (e) { $('erro-senha').textContent = e.status === 401 ? 'Senha incorreta. Confira e tente de novo.' : 'Não foi possível conectar: ' + e.message; $('senha').focus(); })
      .then(function () { bt.disabled = false; bt.textContent = 'Entrar'; });
  });

  if (senha) entrar(); else { mostrar('entrar'); if (matchMedia('(pointer:fine)').matches) $('senha').focus(); }
})();
</script>
</body>
</html>
